<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SceneForge — Text to Movie</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface2: #1e2330;
    --border: #2a3045;
    --accent: #4f8ef7;
    --accent2: #f74f4f;
    --text: #e8eaf0;
    --text-dim: #7a849a;
    --char1: #4f8ef7;
    --char2: #f7734f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: -2px;
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: auto 1fr;
    height: calc(100vh - 57px);
  }

  /* STAGE */
  .stage-wrap {
    grid-column: 1;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }

  .stage-toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .toolbar-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-right: 4px;
  }

  .scene-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s;
  }
  .scene-btn:hover { border-color: var(--accent); color: var(--text); }
  .scene-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.12); }

  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 400px;
    transition: background 0.6s;
  }

  /* ── SCENES ── */
  /* Office */
  .stage.scene-office {
    background: linear-gradient(180deg, #1a1f35 0%, #1a1f35 62%, #10142a 62%);
  }
  .stage.scene-office .scene-bg-office { display: block; }

  /* Park */
  .stage.scene-park {
    background: linear-gradient(180deg, #1a3a28 0%, #1a3a28 60%, #14260f 60%);
  }
  .stage.scene-park .scene-bg-park { display: block; }

  /* Space */
  .stage.scene-space {
    background: radial-gradient(ellipse at 30% 20%, #1a1060 0%, #050510 70%);
  }
  .stage.scene-space .scene-bg-space { display: block; }

  .scene-bg-office,
  .scene-bg-park,
  .scene-bg-space { display: none; }

  /* Floor */
  .floor-line {
    position: absolute;
    bottom: 28%;
    left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,0.07);
  }

  /* Characters */
  .characters-area {
    position: absolute;
    bottom: 28%;
    left: 0; right: 0;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    padding: 0 12%;
  }

  .character-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Speech bubble */
  .speech-bubble {
    position: absolute;
    bottom: calc(100% + 8px);
    background: rgba(255,255,255,0.97);
    color: #111;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 500;
    max-width: 230px;
    text-align: center;
    line-height: 1.4;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    white-space: normal;
    opacity: 0;
    transform: translateY(8px) scale(0.95);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 10;
    left: 50%;
    transform: translateX(-50%) translateY(8px) scale(0.95);
  }
  .speech-bubble.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: rgba(255,255,255,0.97);
  }

  .char-figure {
    width: 90px;
    height: 180px;
    position: relative;
  }

  /* Idle breathing */
  @keyframes idle-breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  /* Talking bob */
  @keyframes talk-bob {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-7px); }
    75% { transform: translateY(-2px); }
  }
  @keyframes mouth-open {
    0%, 100% { ry: 2; }
    50% { ry: 6; }
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.05); }
  }

  .char-figure.idle .char-body-group {
    animation: idle-breathe 2.8s ease-in-out infinite;
  }
  .char-figure.talking .char-body-group {
    animation: talk-bob 0.42s ease-in-out infinite;
  }

  .char-shadow {
    width: 58px;
    height: 10px;
    background: rgba(0,0,0,0.45);
    border-radius: 50%;
    margin-top: -2px;
  }

  .char-nametag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 8px;
    opacity: 0.75;
  }

  /* Stage footer */
  .stage-footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }
  .progress-text {
    font-size: 12px;
    color: var(--text-dim);
    min-width: 60px;
    text-align: right;
  }

  /* CONTROLS */
  .controls-panel {
    grid-column: 2;
    grid-row: 1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .controls-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .playback-btns {
    display: flex;
    gap: 8px;
  }

  .btn {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 18px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-play {
    background: var(--accent);
    color: white;
    flex: 1;
  }
  .btn-play:hover:not(:disabled) { background: #6ba3ff; }
  .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-pause {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-pause:hover:not(:disabled) { border-color: #a78bfa; color: #a78bfa; }
  .btn-pause:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-stop {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn-stop:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
  .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }

  .status-line {
    font-size: 12px;
    color: var(--text-dim);
    min-height: 18px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-line span { color: var(--accent); font-weight: 600; }

  /* EDITOR */
  .editor-panel {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    background: var(--surface2);
    overflow: hidden;
  }

  .editor-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .editor-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .char-legend {
    display: flex;
    gap: 8px;
  }

  .char-pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
  }
  .char-pill.c1 { background: rgba(79,142,247,0.15); color: var(--char1); border: 1px solid rgba(79,142,247,0.3); }
  .char-pill.c2 { background: rgba(247,115,79,0.15); color: var(--char2); border: 1px solid rgba(247,115,79,0.3); }

  .script-textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.8;
    padding: 14px 16px;
    resize: none;
    overflow-y: auto;
  }
  .script-textarea::placeholder { color: var(--text-dim); }

  .editor-footer {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    flex-shrink: 0;
  }

  .line-count { font-size: 11px; color: var(--text-dim); }

  .btn-small {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
  }
  .btn-small:hover { border-color: var(--accent); color: var(--accent); }

  /* Character name inputs */
  .char-names-section {
    display: flex;
    gap: 8px;
  }
  .char-name-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .char-name-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .char-name-label.c1 { color: var(--char1); }
  .char-name-label.c2 { color: var(--char2); }
  .char-name-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
  }
  .char-name-input:focus { border-color: var(--accent); }
  .char-name-input.c1:focus { border-color: var(--char1); }
  .char-name-input.c2:focus { border-color: var(--char2); }

  /* Record button */
  .btn-record {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    position: relative;
  }
  .btn-record:hover:not(:disabled) { border-color: #f74f4f; color: #f74f4f; }
  .btn-record.recording { border-color: #f74f4f; color: #f74f4f; background: rgba(247,79,79,0.1); }
  .rec-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f74f4f;
    display: inline-block;
  }
  .btn-record.recording .rec-dot { animation: rec-blink 1s ease-in-out infinite; }
  @keyframes rec-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Responsive */
  @media (max-width: 900px) {
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      height: auto;
    }
    .stage-wrap { grid-column: 1; grid-row: 1; border-right: none; border-bottom: 1px solid var(--border); }
    .controls-panel { grid-column: 1; grid-row: 2; }
    .editor-panel { grid-column: 1; grid-row: 3; min-height: 280px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">SceneForge</div>
    <div class="logo-sub">Text to Movie</div>
  </div>
</header>

<div class="main">

  <!-- STAGE -->
  <div class="stage-wrap">
    <div class="stage-toolbar">
      <span class="toolbar-label">Scene</span>
      <button class="scene-btn active" onclick="setScene('office', this)">🏢 Office</button>
      <button class="scene-btn" onclick="setScene('park', this)">🌳 Park</button>
      <button class="scene-btn" onclick="setScene('space', this)">🚀 Space</button>
    </div>

    <div class="stage scene-office" id="stage">
      <div class="floor-line"></div>

      <!-- Office background elements -->
      <svg class="scene-bg-office" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
        <!-- window left -->
        <rect x="40" y="40" width="130" height="170" rx="4" fill="rgba(79,142,247,0.06)" stroke="rgba(79,142,247,0.18)" stroke-width="2"/>
        <line x1="105" y1="40" x2="105" y2="210" stroke="rgba(79,142,247,0.12)" stroke-width="1.5"/>
        <line x1="40" y1="125" x2="170" y2="125" stroke="rgba(79,142,247,0.12)" stroke-width="1.5"/>
        <!-- window right -->
        <rect x="630" y="40" width="130" height="170" rx="4" fill="rgba(79,142,247,0.06)" stroke="rgba(79,142,247,0.18)" stroke-width="2"/>
        <line x1="695" y1="40" x2="695" y2="210" stroke="rgba(79,142,247,0.12)" stroke-width="1.5"/>
        <line x1="630" y1="125" x2="760" y2="125" stroke="rgba(79,142,247,0.12)" stroke-width="1.5"/>
        <!-- wall line -->
        <rect x="0" y="305" width="800" height="8" rx="2" fill="rgba(255,255,255,0.05)"/>
        <!-- floor tiles -->
        <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <line x1="100" y1="313" x2="100" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="200" y1="313" x2="200" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="300" y1="313" x2="300" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="400" y1="313" x2="400" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="500" y1="313" x2="500" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="600" y1="313" x2="600" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="700" y1="313" x2="700" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      </svg>

      <!-- Park background elements -->
      <svg class="scene-bg-park" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
        <!-- sky gradient hint -->
        <defs><radialGradient id="sunGlow" cx="50%" cy="20%"><stop offset="0%" stop-color="rgba(255,220,100,0.15)"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs>
        <rect x="0" y="0" width="800" height="300" fill="url(#sunGlow)"/>
        <!-- sun -->
        <circle cx="400" cy="70" r="28" fill="rgba(255,220,60,0.25)"/>
        <circle cx="400" cy="70" r="18" fill="rgba(255,220,60,0.35)"/>
        <!-- tree left -->
        <rect x="55" y="230" width="18" height="80" rx="4" fill="rgba(80,40,10,0.6)"/>
        <ellipse cx="64" cy="220" rx="45" ry="55" fill="rgba(30,120,30,0.55)"/>
        <ellipse cx="64" cy="200" rx="30" ry="38" fill="rgba(40,150,40,0.5)"/>
        <!-- tree right -->
        <rect x="720" y="230" width="18" height="80" rx="4" fill="rgba(80,40,10,0.6)"/>
        <ellipse cx="729" cy="220" rx="45" ry="55" fill="rgba(30,120,30,0.55)"/>
        <ellipse cx="729" cy="200" rx="30" ry="38" fill="rgba(40,150,40,0.5)"/>
        <!-- bench middle -->
        <rect x="350" y="295" width="100" height="8" rx="2" fill="rgba(100,60,20,0.6)"/>
        <rect x="355" y="303" width="8" height="16" rx="2" fill="rgba(80,40,10,0.6)"/>
        <rect x="437" y="303" width="8" height="16" rx="2" fill="rgba(80,40,10,0.6)"/>
        <!-- grass texture -->
        <rect x="0" y="300" width="800" height="200" fill="rgba(20,50,15,0.3)"/>
        <path d="M0 305 Q100 295 200 305 Q300 315 400 305 Q500 295 600 305 Q700 315 800 305" stroke="rgba(40,120,20,0.25)" stroke-width="3" fill="none"/>
      </svg>

      <!-- Space background elements -->
      <svg class="scene-bg-space" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
        <!-- stars -->
        <circle cx="42" cy="28" r="1.5" fill="white" opacity=".9"/>
        <circle cx="130" cy="65" r="1" fill="white" opacity=".7"/>
        <circle cx="250" cy="40" r="2" fill="rgba(200,180,255,.9)"/>
        <circle cx="380" cy="20" r="1.5" fill="white" opacity=".8"/>
        <circle cx="490" cy="55" r="1" fill="white" opacity=".6"/>
        <circle cx="600" cy="30" r="1.5" fill="white" opacity=".9"/>
        <circle cx="720" cy="18" r="1" fill="white" opacity=".7"/>
        <circle cx="760" cy="80" r="2" fill="rgba(180,200,255,.8)"/>
        <circle cx="80" cy="120" r="1" fill="white" opacity=".5"/>
        <circle cx="200" cy="150" r="1.5" fill="white" opacity=".7"/>
        <circle cx="320" cy="100" r="1" fill="white" opacity=".6"/>
        <circle cx="540" cy="140" r="2" fill="rgba(255,200,200,.7)"/>
        <circle cx="680" cy="110" r="1" fill="white" opacity=".8"/>
        <circle cx="160" cy="220" r="1" fill="white" opacity=".4"/>
        <circle cx="420" cy="200" r="1.5" fill="white" opacity=".6"/>
        <circle cx="650" cy="190" r="1" fill="white" opacity=".5"/>
        <!-- planet -->
        <circle cx="650" cy="100" r="55" fill="rgba(100,60,160,0.2)" stroke="rgba(120,80,200,0.3)" stroke-width="1.5"/>
        <ellipse cx="650" cy="100" rx="90" ry="16" fill="none" stroke="rgba(120,80,200,0.25)" stroke-width="3"/>
        <!-- nebula glow -->
        <radialGradient id="neb" cx="20%" cy="60%"><stop offset="0%" stop-color="rgba(80,40,160,0.3)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
        <ellipse cx="150" cy="350" rx="200" ry="120" fill="rgba(80,40,160,0.12)"/>
        <!-- platform / ground glow -->
        <rect x="50" y="307" width="700" height="6" rx="3" fill="rgba(100,80,220,0.35)"/>
        <rect x="50" y="308" width="700" height="20" rx="0" fill="rgba(60,40,160,0.15)"/>
        <!-- stars low -->
        <circle cx="90" cy="260" r="1" fill="white" opacity=".4"/>
        <circle cx="350" cy="270" r="1.5" fill="white" opacity=".5"/>
        <circle cx="560" cy="250" r="1" fill="white" opacity=".4"/>
        <circle cx="730" cy="265" r="1.5" fill="rgba(180,200,255,.6)"/>
      </svg>

      <div class="characters-area" id="characters-area">

        <!-- Character 1 (blue, faces right) -->
        <div class="character-wrap" id="char1-wrap">
          <div class="speech-bubble" id="bubble1"></div>
          <div class="char-figure idle" id="char1-fig">
            <svg id="char1-svg" width="90" height="175" viewBox="0 0 90 175" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g class="char-body-group">
                <!-- Legs -->
                <rect x="29" y="116" width="13" height="44" rx="6" fill="#3068d0"/>
                <rect x="47" y="116" width="13" height="44" rx="6" fill="#3068d0"/>
                <!-- Feet -->
                <ellipse cx="35" cy="160" rx="10" ry="5.5" fill="#2050b0"/>
                <ellipse cx="53" cy="160" rx="10" ry="5.5" fill="#2050b0"/>
                <!-- Body -->
                <rect x="20" y="68" width="50" height="52" rx="11" fill="#4f8ef7"/>
                <!-- Shirt placket -->
                <rect x="38" y="68" width="14" height="22" rx="3" fill="#3a7ae8"/>
                <!-- Collar -->
                <path d="M 34 68 L 45 80 L 56 68" stroke="#2a5acc" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
                <!-- Left arm -->
                <path d="M 20 76 Q 6 82 8 96" stroke="#4f8ef7" stroke-width="13" stroke-linecap="round" fill="none"/>
                <ellipse cx="8" cy="97" rx="7" ry="7" fill="#4f8ef7"/>
                <!-- Right arm -->
                <path d="M 70 76 Q 84 82 82 96" stroke="#4f8ef7" stroke-width="13" stroke-linecap="round" fill="none"/>
                <ellipse cx="82" cy="97" rx="7" ry="7" fill="#4f8ef7"/>
                <!-- Neck -->

                <!-- Ear left -->

                <!-- Eyes -->

                <!-- Eyebrows (arched, expressive) -->
                <path d="M 27 31 Q 33 27 38 30" stroke="#180a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

                <!-- Nose -->
                <path d="M 43 46 Q 45 50 47 46" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <!-- Mouth: idle smile -->
                <path id="char2-mouth-idle" d="M 36 57 Q 45 63 54 57" stroke="#b05840" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <!-- Mouth: talking -->
                <ellipse id="char2-mouth-talk" cx="45" cy="58" rx="9" ry="0" fill="#7a1a1a" stroke="#b05840" stroke-width="1.5"/>

<script>
// ── Canvas Renderer (RC) ──────────────────────────────────────────────────────
const RC = (() => {
  const canvas = document.getElementById('record-canvas');
  const ctx = canvas.getContext('2d');
  let rafId = null;
  let startTime = null;
  let talkingIdx = -1;   // -1 = none, 0 = char0, 1 = char1
  let bubbleText = '';
  let mouthRy = 2;

  // Character color palettes
  const PALETTES = [
    { body:'#4f8ef7', dark:'#3068d0', darker:'#2050b0', skin:'#f0c090', darkskin:'#e0a870', hair:'#2a1808', iris:'#1e44cc' },
    { body:'#f7734f', dark:'#b03c1e', darker:'#8a2c12', skin:'#f0d0a8', darkskin:'#e0b888', hair:'#180a2a', iris:'#5a1a9a' }
  ];

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  function drawCharacter(ctx, idx, cx, bottomY, talking, ry, bobOffset) {
    const p = PALETTES[idx];
    const isFlipped = idx === 1;
    const by = bottomY + bobOffset;

    ctx.save();
    if (isFlipped) {
      ctx.translate(cx * 2, 0);
      ctx.scale(-1, 1);
    }

    // Shadow
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(cx, by, 29, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Legs
    ctx.fillStyle = p.dark;
    roundRect(ctx, cx-16, by-54, 13, 44, 6); ctx.fill();
    roundRect(ctx, cx+3, by-54, 13, 44, 6);  ctx.fill();

    // Feet
    ctx.fillStyle = p.darker;
    ctx.beginPath(); ctx.ellipse(cx-10, by-10, 10, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+8, by-10, 10, 5.5, 0, 0, Math.PI*2); ctx.fill();

    // Body
    ctx.fillStyle = p.body;
    roundRect(ctx, cx-25, by-102, 50, 52, 11); ctx.fill();

    // Shirt placket
    ctx.fillStyle = p.dark;
    roundRect(ctx, cx-7, by-102, 14, 22, 3); ctx.fill();

    // Arms
    ctx.strokeStyle = p.body;
    ctx.lineWidth = 13;
    ctx.lineCap = 'round';
    // Left arm
    ctx.beginPath();
    ctx.moveTo(cx-25, by-94);
    ctx.quadraticCurveTo(cx-39, by-88, cx-37, by-74);
    ctx.stroke();
    ctx.fillStyle = p.body;
    ctx.beginPath(); ctx.arc(cx-37, by-73, 7, 0, Math.PI*2); ctx.fill();
    // Right arm
    ctx.beginPath();
    ctx.moveTo(cx+25, by-94);
    ctx.quadraticCurveTo(cx+39, by-88, cx+37, by-74);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+37, by-73, 7, 0, Math.PI*2); ctx.fill();

    // Neck
    ctx.fillStyle = p.skin;
    roundRect(ctx, cx-8, by-116, 16, 17, 6); ctx.fill();

    // Head
    roundRect(ctx, cx-29, by-158, 58, 50, 18); ctx.fill();

    // Hair
    ctx.fillStyle = p.hair;
    roundRect(ctx, cx-29, by-158, 58, 20, 14); ctx.fill();
    // side pieces
    roundRect(ctx, cx-29, by-150, 11, 16, 5); ctx.fill();
    if (idx === 1) {
      roundRect(ctx, cx+18, by-150, 11, 14, 5); ctx.fill();
    }

    // Ears
    ctx.fillStyle = p.darkskin;
    ctx.beginPath(); ctx.ellipse(cx-29, by-130, 4.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+29, by-130, 4.5, 6.5, 0, 0, Math.PI*2); ctx.fill();

    // Eyes
    const eyeOffsets = [-12, 12];
    eyeOffsets.forEach(ex => {
      const eyeX = cx + ex;
      const eyeY = by-130;
      ctx.fillStyle = 'white';
      ctx.beginPath(); ctx.ellipse(eyeX, eyeY, 5.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = p.iris;
      ctx.beginPath(); ctx.ellipse(eyeX+1.5, eyeY+1, 3.2, 3.8, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#060d30';
      ctx.beginPath(); ctx.arc(eyeX+1.5, eyeY, 1.3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'white';
      ctx.beginPath(); ctx.arc(eyeX+2.8, eyeY-1.2, 0.8, 0, Math.PI*2); ctx.fill();
    });

    // Eyebrows
    ctx.strokeStyle = p.hair;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx-18, by-138); ctx.quadraticCurveTo(cx-12, by-141, cx-7, by-139); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+7, by-138); ctx.quadraticCurveTo(cx+13, by-141, cx+18, by-139); ctx.stroke();

    // Nose
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx-2, by-124); ctx.quadraticCurveTo(cx, by-120, cx+2, by-124); ctx.stroke();

    // Mouth
    if (talking && ry > 0) {
      ctx.fillStyle = '#7a1a1a';
      ctx.beginPath(); ctx.ellipse(cx, by-112, 9, ry, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = idx === 0 ? '#c07050' : '#b05840';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      ctx.strokeStyle = idx === 0 ? '#c07050' : '#b05840';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx-9, by-115);
      ctx.quadraticCurveTo(cx, by-109, cx+9, by-115);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBubble(ctx, text, cx, bubbleBottomY) {
    if (!text) return;
    ctx.save();
    const maxWidth = 200;
    const fontSize = 13;
    ctx.font = `600 ${fontSize}px "Segoe UI", system-ui, sans-serif`;

    // Word wrap
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth) {
        if (line) lines.push(line);
        line = w;
      } else { line = test; }
    }
    if (line) lines.push(line);

    const lineH = fontSize * 1.4;
    const padX = 14, padY = 10;
    const textW = Math.min(maxWidth, Math.max(...lines.map(l => ctx.measureText(l).width)));
    const boxW = textW + padX * 2;
    const boxH = lines.length * lineH + padY * 2;
    const boxX = cx - boxW / 2;
    const boxY = bubbleBottomY - boxH;
    const r = 12;

    // Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;

    // Box
    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    roundRect(ctx, boxX, boxY, boxW, boxH, r);
    ctx.fill();

    ctx.shadowColor = 'transparent';

    // Triangle pointer
    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    ctx.beginPath();
    ctx.moveTo(cx - 8, bubbleBottomY);
    ctx.lineTo(cx + 8, bubbleBottomY);
    ctx.lineTo(cx, bubbleBottomY + 10);
    ctx.closePath();
    ctx.fill();

    // Text
    ctx.fillStyle = '#111';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    lines.forEach((l, i) => {
      ctx.fillText(l, cx, boxY + padY + i * lineH);
    });

    ctx.restore();
  }

  function drawBackground(ctx) {
    const scene = document.getElementById('stage').className.replace(/.*scene-(\w+).*/, '$1');
    if (scene === 'office') {
      ctx.fillStyle = '#1a1f35';
      ctx.fillRect(0, 0, 800, 310);
      ctx.fillStyle = '#10142a';
      ctx.fillRect(0, 310, 800, 190);
      // Windows
      [[40,40],[630,40]].forEach(([wx,wy]) => {
        ctx.fillStyle = 'rgba(79,142,247,0.06)';
        roundRect(ctx, wx, wy, 130, 170, 4); ctx.fill();
        ctx.strokeStyle = 'rgba(79,142,247,0.18)'; ctx.lineWidth = 2;
        roundRect(ctx, wx, wy, 130, 170, 4); ctx.stroke();
        ctx.strokeStyle = 'rgba(79,142,247,0.12)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(wx+65, wy); ctx.lineTo(wx+65, wy+170); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(wx, wy+85); ctx.lineTo(wx+130, wy+85); ctx.stroke();
      });
    } else if (scene === 'park') {
      ctx.fillStyle = '#1a3a28';
      ctx.fillRect(0, 0, 800, 300);
      ctx.fillStyle = '#14260f';
      ctx.fillRect(0, 300, 800, 200);
      // Trees
      [[64,230],[729,230]].forEach(([tx,ty]) => {
        ctx.fillStyle = 'rgba(80,40,10,0.6)';
        roundRect(ctx, tx-9, ty, 18, 80, 4); ctx.fill();
        ctx.fillStyle = 'rgba(30,120,30,0.55)';
        ctx.beginPath(); ctx.ellipse(tx, ty-10, 45, 55, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(40,150,40,0.5)';
        ctx.beginPath(); ctx.ellipse(tx, ty-30, 30, 38, 0, 0, Math.PI*2); ctx.fill();
      });
    } else {
      // Space
      const grad = ctx.createRadialGradient(240, 100, 10, 240, 100, 700);
      grad.addColorStop(0, '#1a1060');
      grad.addColorStop(1, '#050510');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 800, 500);
      // Stars
      const stars = [[42,28],[130,65],[250,40],[380,20],[490,55],[600,30],[720,18],[760,80],[80,120],[200,150]];
      ctx.fillStyle = 'white';
      stars.forEach(([sx,sy]) => {
        ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI*2); ctx.fill();
      });
      // Planet
      ctx.fillStyle = 'rgba(100,60,160,0.2)';
      ctx.beginPath(); ctx.arc(650, 100, 55, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(120,80,200,0.3)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(650, 100, 55, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = 'rgba(120,80,200,0.25)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(650, 100, 90, 16, 0, 0, Math.PI*2); ctx.stroke();
      // Platform
      ctx.fillStyle = 'rgba(100,80,220,0.35)';
      roundRect(ctx, 50, 307, 700, 6, 3); ctx.fill();
    }
  }

  function renderFrame() {
    const ts = performance.now();
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;

    ctx.clearRect(0, 0, 800, 500);
    drawBackground(ctx);

    // Floor line
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(0, 360, 800, 2);

    const bottomY = 360;

    // Bob animation
    const bob0 = Math.sin(elapsed / 2800 * Math.PI * 2) * (talkingIdx === 0 ? 7 : 3);
    const bob1 = Math.sin(elapsed / 2600 * Math.PI * 2 + 1) * (talkingIdx === 1 ? 7 : 3);

    // Char 0 at x=200
    drawCharacter(ctx, 0, 200, bottomY, talkingIdx === 0, mouthRy, bob0);
    // Char 1 at x=600 (flipped)
    drawCharacter(ctx, 1, 600, bottomY, talkingIdx === 1, mouthRy, bob1);

    // Speech bubbles
    if (talkingIdx === 0 && bubbleText) drawBubble(ctx, bubbleText, 200, bottomY - 170);
    if (talkingIdx === 1 && bubbleText) drawBubble(ctx, bubbleText, 600, bottomY - 170);

    // Nametags
    ctx.font = 'bold 11px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '1.5px';
    ctx.fillStyle = '#4f8ef7';
    ctx.fillText((document.getElementById('char1-name').textContent || 'ALEX').toUpperCase(), 200, bottomY + 20);
    ctx.fillStyle = '#f7734f';
    ctx.fillText((document.getElementById('char2-name').textContent || 'MORGAN').toUpperCase(), 600, bottomY + 20);

  }

  return {
    start() {
      startTime = null;
      if (rafId) clearInterval(rafId);
      rafId = setInterval(renderFrame, 1000 / 30); // 30fps via setInterval — not paused by getDisplayMedia dialog
    },
    stop() {
      if (rafId) { clearInterval(rafId); rafId = null; }
    },
    setTalking(idx, text) {
      talkingIdx = idx;
      bubbleText = text || '';
    },
    setIdle(idx) {
      // Only clear if this character is currently the one talking
      if (talkingIdx === idx) {
        talkingIdx = -1;
        bubbleText = '';
      }
    },
    setMouth(ry) {
      mouthRy = ry;
    }
  };
})();

// ── Eye blink keyframe via WAAPI ──────────────────────────────────────────────
document.querySelectorAll('.blink-eye').forEach(el => {

// ── State ─────────────────────────────────────────────────────────────────────
let lines = [];
let currentLine = -1;
let isPlaying = false;
let isPaused = false;
let stopRequested = false;
let charMap = {};  // charName -> charIndex (0 or 1)
let mouthTimerIds = [null, null];

// ── Sample ────────────────────────────────────────────────────────────────────
const SAMPLE = `ALEX: Good morning, Morgan. Have you seen the Q3 report yet?
MORGAN: I have, and honestly? The numbers are wild. We're up forty percent.
ALEX: Forty percent? That can't be right. Let me see that.
MORGAN: I triple-checked. The product launch exceeded every single projection.

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadSample();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => {};  // trigger load
    speechSynthesis.getVoices();
  }
  document.getElementById('script-editor').addEventListener('input', parseScript);
});

function loadSample() {
  document.getElementById('script-editor').value = SAMPLE;
  parseScript();
}

// ── Scene ─────────────────────────────────────────────────────────────────────
function setScene(name, btn) {
  document.getElementById('stage').className = 'stage scene-' + name;
  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Parse ─────────────────────────────────────────────────────────────────────
function parseScript() {
  const raw = document.getElementById('script-editor').value;
  lines = [];
  const chars = [];

  raw.split('\n').forEach(l => {
    const t = l.trim();
    if (!t) return;
    const colon = t.indexOf(':');
    if (colon < 1) return;
    const char = t.slice(0, colon).trim().toUpperCase();
    const text = t.slice(colon + 1).trim();
    if (!text) return;
    lines.push({ char, text });
    if (!chars.includes(char)) chars.push(char);
  });

  const c1 = chars[0] || 'ALEX';
  const c2 = chars[1] || 'MORGAN';
  charMap = {};
  charMap[c1] = 0;
  charMap[c2] = 1;

  document.getElementById('char1-name').textContent = c1;
  document.getElementById('char2-name').textContent = c2;
  document.getElementById('legend-c1').textContent = c1;
  document.getElementById('legend-c2').textContent = c2;

  const n = lines.length;
  document.getElementById('line-count').textContent = n + (n === 1 ? ' line' : ' lines');
  updateProgress(0, n);
}

// ── Voice helpers ─────────────────────────────────────────────────────────────
function getBestVoice(forIndex) {
  const all = speechSynthesis.getVoices();
  const eng = all.filter(v => v.lang.startsWith('en'));
  const pool = eng.length ? eng : all;
  if (!pool.length) return null;

  if (forIndex === 0) {
    // prefer deeper male voices
    return pool.find(v => /david|james|daniel|fred|ralph|alex|google us|en-us.*male/i.test(v.name))
      || pool[0];
  } else {
    // prefer female voices
    return pool.find(v => /samantha|victoria|karen|susan|zira|fiona|female|woman|google uk/i.test(v.name))
      || pool[Math.min(1, pool.length - 1)];
  }
}

// ── Playback ──────────────────────────────────────────────────────────────────
function handlePlay() {
  if (lines.length === 0) { parseScript(); if (lines.length === 0) return; }

  if (isPaused) {
    isPaused = false;
    speechSynthesis.resume();
    setStatus('Playing…');
    setPauseBtn(false);
    return;
  }

  stopRequested = false;
  isPlaying = true;
  currentLine = -1;
  setButtonState(true);
  speakNext();
}

function handlePause() {
  if (!isPlaying) return;
  if (isPaused) {
    isPaused = false;
    speechSynthesis.resume();
    setStatus('Playing…');
    setPauseBtn(false);
  } else {
    isPaused = true;
    speechSynthesis.pause();
    const char = lines[currentLine]?.char || '';
    setStatus('Paused — <span>' + char + '</span>');
    setPauseBtn(true);
  }
}

function handleStop() {
  stopRequested = true;
  speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  currentLine = -1;
  setButtonState(false);
  setPauseBtn(false);
  setIdle(0); setIdle(1);
  hideBubble(0); hideBubble(1);
  updateProgress(0, lines.length);
  setStatus('Stopped');
}

function speakNext() {
  if (stopRequested) return;
  currentLine++;

  if (currentLine >= lines.length) {
    isPlaying = false;
    setButtonState(false);
    setIdle(0); setIdle(1);
    hideBubble(0); hideBubble(1);
    updateProgress(lines.length, lines.length);
    setStatus('Finished!');
    if (isRecording) setTimeout(finishRecording, 800);
    return;
  }

  const { char, text } = lines[currentLine];
  const idx = (charMap[char] !== undefined) ? charMap[char] : 0;
  const other = idx === 0 ? 1 : 0;

  updateProgress(currentLine + 1, lines.length);
  setStatus('<span>' + char + '</span>: ' + (text.length > 50 ? text.slice(0, 50) + '…' : text));

  setTalking(idx);
  setIdle(other);
  showBubble(idx, text);
  hideBubble(other);

  const utt = new SpeechSynthesisUtterance(text);
  const voice = getBestVoice(idx);
  if (voice) utt.voice = voice;
  utt.pitch = idx === 0 ? 0.95 : 1.35;
  utt.rate  = idx === 0 ? 0.92 : 1.05;

  utt.onend = () => {
    if (stopRequested) return;
    setIdle(idx);
    setTimeout(() => {
      if (!stopRequested) speakNext();
    }, 300);
  };
  utt.onerror = (e) => {
    if (stopRequested || e.error === 'interrupted') return;
    setIdle(idx);
    setTimeout(speakNext, 200);
  };

  speechSynthesis.speak(utt);

  if (isRecording) {
    const estimatedDuration = Math.max(1, text.split(/\s+/).length * 0.4) + 0.3;
    synthesizeVoice(text, idx, estimatedDuration);
  }
}

function updateProgress(cur, total) {
  document.getElementById('progress-fill').style.width = (total > 0 ? (cur / total) * 100 : 0) + '%';
  document.getElementById('progress-text').textContent = cur + ' / ' + total;
}

function setTalking(idx) {
  const n = idx + 1;
  const fig = document.getElementById('char' + n + '-fig');
  fig.classList.remove('idle');
  fig.classList.add('talking');

  // Show open mouth
  const idle = document.getElementById('char' + n + '-mouth-idle');
  const talk = document.getElementById('char' + n + '-mouth-talk');
  if (idle) idle.style.display = 'none';
  if (talk) {
    talk.setAttribute('ry', '5.5');
    talk.style.opacity = '1';
    // Animate ry via WAAPI on the element
    clearInterval(mouthTimerIds[idx]);
    let open = true;
    mouthTimerIds[idx] = setInterval(() => {
      if (!talk) return;
      const ryVal = open ? 5.5 : 2;
      talk.setAttribute('ry', ryVal);
      RC.setMouth(ryVal);
      open = !open;
    }, 140);
  }

  RC.setTalking(idx, lines[currentLine]?.text || '');
}

function setIdle(idx) {
  const n = idx + 1;
  const fig = document.getElementById('char' + n + '-fig');
  fig.classList.remove('talking');
  fig.classList.add('idle');

  clearInterval(mouthTimerIds[idx]);
  const idle = document.getElementById('char' + n + '-mouth-idle');
  const talk = document.getElementById('char' + n + '-mouth-talk');
  if (idle) idle.style.display = '';
  if (talk) { talk.setAttribute('ry', '0'); talk.style.opacity = '0'; }

  RC.setIdle(idx);
}

// ── Video Recording (.mov with audio) ─────────────────────────────────────────
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let recordingStartTime = 0;

function pickMime(candidates) {
  for (const m of candidates) if (MediaRecorder.isTypeSupported(m)) return m;
  return candidates[candidates.length - 1];
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

// Chrome MediaRecorder with video/mp4 produces fragmented MP4 (fMP4) where
// mvhd.duration is 0 because duration is unknown at recording start.
// This patches the duration fields so players like QuickTime can play the file.
async function patchMp4Duration(chunks, mimeType, durationMs) {
  const raw = new Blob(chunks, { type: mimeType });
  if (!mimeType.includes('mp4')) return raw; // WebM handles duration correctly
  const buf = await raw.arrayBuffer();
  const u8 = new Uint8Array(buf);
  const view = new DataView(buf);

  function tag(i) { return String.fromCharCode(u8[i], u8[i+1], u8[i+2], u8[i+3]); }

  for (let i = 4; i < u8.length - 44; i++) {
    if (tag(i) !== 'mvhd') continue;
    const bs = i - 4; // box start (size field)
    const ver = u8[bs + 8];
    if (ver === 1) {
      // v1: timescale at bs+28 (4 bytes), duration at bs+32 (8 bytes)
      const timescale = view.getUint32(bs + 28) || 1000;
      view.setUint32(bs + 28, timescale);
      view.setBigUint64(bs + 32, BigInt(Math.round(durationMs * timescale / 1000)));
    } else {
      // v0: timescale at bs+20 (4 bytes), duration at bs+24 (4 bytes)
      const timescale = view.getUint32(bs + 20) || 1000;
      view.setUint32(bs + 24, Math.round(durationMs * timescale / 1000));
    }
    // Patch mehd (movie extends header) — fMP4 fragment duration hint
    for (let j = bs; j < Math.min(bs + 600, u8.length - 16); j++) {
      if (tag(j) !== 'mehd') continue;
      const mbs = j - 4;
      const mv = u8[mbs + 8];
      const ts2 = ver === 1 ? view.getUint32(bs + 28) : view.getUint32(bs + 20);
      if (mv === 1) view.setBigUint64(mbs + 12, BigInt(Math.round(durationMs * ts2 / 1000)));
      else          view.setUint32(mbs + 12, Math.round(durationMs * ts2 / 1000));
      break;
    }
    break;
  }

  // Patch all tkhd (track header) duration fields — use mvhd timescale (1000)
  for (let i = 4; i < u8.length - 44; i++) {
    if (tag(i) !== 'tkhd') continue;
    const bs = i - 4;
    const ver = u8[bs + 8];
    const dur = Math.round(durationMs); // timescale=1000 so ms == units
    if (ver === 1) view.setBigUint64(bs + 36, BigInt(dur));
    else           view.setUint32(bs + 28, dur);
  }

  return new Blob([buf], { type: mimeType });
}

// Web Audio synthesizer — routes character voices into the recording stream.
// speechSynthesis bypasses the browser audio pipeline so can't be captured;
// this oscillator-based synth goes through AudioContext and is always capturable.
let recAudioCtx = null;
let recAudioDest = null;

let recMasterComp = null;

function startRecordAudio() {
  recAudioCtx = new AudioContext();
  recAudioDest = recAudioCtx.createMediaStreamDestination();
  recMasterComp = recAudioCtx.createDynamicsCompressor();
  recMasterComp.threshold.value = -14;
  recMasterComp.knee.value = 4;
  recMasterComp.ratio.value = 6;
  recMasterComp.attack.value = 0.002;
  recMasterComp.release.value = 0.1;
  recMasterComp.connect(recAudioDest);

  // Audible "bloop" at t=0 confirms audio capture is working before any speech
  playBloop(recAudioCtx.currentTime);
}

function stopRecordAudio() {
  if (recAudioCtx) { recAudioCtx.close(); recAudioCtx = null; recAudioDest = null; recMasterComp = null; }
}

function playBloop(t) {
  if (!recAudioCtx || !recMasterComp) return;
  [440, 660].forEach((freq, i) => {
    const osc = recAudioCtx.createOscillator();
    const g   = recAudioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t + i * 0.12);
    g.gain.linearRampToValueAtTime(0.4, t + i * 0.12 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.18);
    osc.connect(g); g.connect(recMasterComp);
    osc.start(t + i * 0.12);
    osc.stop(t + i * 0.12 + 0.2);
  });
}

function synthesizeVoice(text, charIdx, durationSec) {
  if (!recAudioCtx || !recMasterComp) return;
  const pitch = charIdx === 0 ? 105 : 175;
  const words = text.trim().split(/\s+/).filter(Boolean);
  const wordDur = durationSec / Math.max(words.length, 1);
  const now = recAudioCtx.currentTime;

  // Output to both recording AND speakers so you hear what's captured
  const out = [recMasterComp, recAudioCtx.destination];

  const pitchSteps = [1, 1.08, 0.95, 1.05, 0.92, 1.12, 0.97];

  words.forEach((word, i) => {
    const t = now + i * wordDur;
    const dur = wordDur * 0.78;
    const syllables = Math.max(1, Math.ceil(word.length / 3));
    const sylDur = dur / syllables;

    for (let s = 0; s < syllables; s++) {
      const st = t + s * sylDur;
      const pMul = pitchSteps[(i + s) % pitchSteps.length];

      // ── Voiced carrier (sawtooth → formant filters) ──
      const osc = recAudioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = pitch * pMul;
      // F1 + F2 in parallel
      const f1 = recAudioCtx.createBiquadFilter();
      f1.type = 'bandpass'; f1.frequency.value = charIdx === 0 ? 650 : 700; f1.Q.value = 10;
      const f2 = recAudioCtx.createBiquadFilter();
      f2.type = 'bandpass'; f2.frequency.value = charIdx === 0 ? 1100 : 2100; f2.Q.value = 10;
      const vGain = recAudioCtx.createGain();
      vGain.gain.setValueAtTime(0, st);
      vGain.gain.linearRampToValueAtTime(0.32, st + 0.02);
      vGain.gain.setValueAtTime(0.26, st + sylDur * 0.55);
      vGain.gain.linearRampToValueAtTime(0, st + sylDur * 0.90);
      osc.connect(f1); osc.connect(f2);
      f1.connect(vGain); f2.connect(vGain);
      out.forEach(o => vGain.connect(o));
      osc.start(st); osc.stop(st + sylDur);

      // ── Noise burst at syllable onset (consonant feel) ──
      const bufSize = recAudioCtx.sampleRate * 0.06;
      const buf = recAudioCtx.createBuffer(1, bufSize, recAudioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let k = 0; k < bufSize; k++) d[k] = Math.random() * 2 - 1;
      const ns = recAudioCtx.createBufferSource();
      ns.buffer = buf;
      const nfilt = recAudioCtx.createBiquadFilter();
      nfilt.type = 'bandpass'; nfilt.frequency.value = 2800; nfilt.Q.value = 1.5;
      const nGain = recAudioCtx.createGain();
      nGain.gain.setValueAtTime(0.12, st);
      nGain.gain.linearRampToValueAtTime(0, st + 0.055);
      ns.connect(nfilt); nfilt.connect(nGain);
      out.forEach(o => nGain.connect(o));
      ns.start(st); ns.stop(st + 0.06);
    }
  });
}

function toggleRecording() {
  if (isRecording) { finishRecording(); return; }

  const recCanvas = document.getElementById('record-canvas');
  RC.start();
  startRecordAudio();
  const canvasStream = recCanvas.captureStream(30);
  const audioStream = recAudioDest.stream;

  // webm/opus is Chrome's native MediaRecorder format and reliably captures audio;
  // mp4 variants often silently drop the audio track
  const mimeType = pickMime([
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4'
  ]);
  const fileExt = mimeType.startsWith('video/webm') ? 'webm' : 'mov';

  const combined = new MediaStream([
    ...canvasStream.getVideoTracks(),
    ...audioStream.getAudioTracks()
  ]);
  mediaRecorder = new MediaRecorder(combined, { mimeType });
  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    RC.stop();
    stopRecordAudio();
    try {
      const durationMs = performance.now() - recordingStartTime;
      setRecordStatus('Processing…');
      // patchMp4Duration only needed for fragmented MP4; WebM has correct duration natively
      const blob = fileExt === 'mov'
        ? await patchMp4Duration(recordedChunks, mimeType, durationMs)
        : new Blob(recordedChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const rs = document.getElementById('record-status');
      rs.innerHTML = '';
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sceneforge-movie.' + fileExt;
      a.textContent = '⬇ Click to download sceneforge-movie.' + fileExt;
      a.style.cssText = 'color:#4f8ef7;font-weight:700;text-decoration:underline;cursor:pointer;font-size:12px;';
      a.onclick = () => setTimeout(() => { URL.revokeObjectURL(url); rs.textContent = '✅ Downloaded!'; }, 1000);
      rs.appendChild(a);
    } catch (err) {
      setRecordStatus('❌ Error: ' + err.message);
    }
  };

  mediaRecorder.start(100);
  recordingStartTime = performance.now();
  isRecording = true;

  const btn = document.getElementById('btn-record');
  btn.classList.add('recording');
  btn.innerHTML = '<span class="rec-dot"></span> Stop & Save Early';
  setRecordStatus('🔴 Recording with audio ✓ · auto-saves when scene ends');

  // Auto-start playback
  handleStop();
  setTimeout(() => handlePlay(), 300);
}

function finishRecording() {
  isRecording = false;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  document.getElementById('record-canvas').style.display = 'none';
  const btn = document.getElementById('btn-record');
  btn.classList.remove('recording');
  btn.innerHTML = '<span class="rec-dot"></span> Record Video (.mov)';
  setRecordStatus('Saving…');
}

function setRecordStatus(msg) {
  document.getElementById('record-status').textContent = msg; // clears any link nodes too
}

// ── Save / Load Scene ─────────────────────────────────────────────────────────
function saveScene() {
  const stageEl = document.getElementById('stage');
  const sceneMatch = stageEl.className.match(/scene-(\w+)/);
  const scene = sceneMatch ? sceneMatch[1] : 'office';

  const data = {
    version: 1,
    scene,
    char1Name: document.getElementById('input-c1').value,
    char2Name: document.getElementById('input-c2').value,
    script: document.getElementById('script-editor').value
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const title = (data.char1Name + '-' + data.char2Name).toLowerCase().replace(/\s+/g, '-');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sceneforge-' + title + '.sceneforge';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  setRecordStatus('Scene saved!');
  setTimeout(() => setRecordStatus(''), 2500);
}

function loadSceneFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      // Restore script
      if (data.script !== undefined) {
        document.getElementById('script-editor').value = data.script;
        parseScript();
      }
      // Restore character names — mark as manual so they survive script re-parse
      manuallyRenamed = [false, false];
      if (data.char1Name) {
        document.getElementById('input-c1').value = data.char1Name;
        renameChar(0, data.char1Name);
      }
      if (data.char2Name) {
        document.getElementById('input-c2').value = data.char2Name;
        renameChar(1, data.char2Name);
      }
      // Restore scene
      if (data.scene) {
        const btn = document.querySelector('.scene-btn[onclick*="' + data.scene + '"]');
        setScene(data.scene, btn || document.querySelector('.scene-btn'));
        if (btn) {
          document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }
      }
      setRecordStatus('Scene loaded!');
      setTimeout(() => setRecordStatus(''), 2500);
    } catch {
      setRecordStatus('Invalid scene file');
      setTimeout(() => setRecordStatus(''), 3000);
    }
  };
  reader.readAsText(file);
  input.value = '';
}
</script>
